<header class="header-wrap">

  <nav class="nav-shell" aria-label="Main navigation">

    <!-- LOGO -->
    <button
      class="brand"
      type="button"
      aria-label="La Cantera Soccer Academy home"
      routerLink="/"
      (click)="closeMenu()"
    >
      <img
        src="assets/images/logo.png"
        alt="La Cantera Soccer Academy logo"
      >
    </button>


    <!-- MAIN NAVIGATION -->
    <div
      class="nav-links"
      [class.nav-links--open]="menuOpen()"
    >

      <button
        type="button"
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeMenu()"
      >
        Home
      </button>

      <button
        type="button"
        routerLink="/about"
        routerLinkActive="active"
        (click)="closeMenu()"
      >
        About
      </button>

      <button
        type="button"
        routerLink="/programs"
        routerLinkActive="active"
        (click)="closeMenu()"
      >
        Programs
      </button>

      <button
        type="button"
        routerLink="/gallery"
        routerLinkActive="active"
        (click)="closeMenu()"
      >
        Gallery
      </button>

      <button
        type="button"
        routerLink="/contact"
        routerLinkActive="active"
        (click)="closeMenu()"
      >
        Contact
      </button>

    </div>


    <!-- RIGHT ACTIONS -->
    <div class="nav-actions">

      <!-- SEARCH -->
      <button
        class="small-action small-action--search"
        type="button"
        aria-label="Search"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5"></circle>
          <path d="m16 16 4 4"></path>
        </svg>

        <span>Search</span>
      </button>


      <!-- LOGIN -->
      <button
        class="small-action"
        type="button"
        aria-label="Login"
        routerLink="/login"
        (click)="closeMenu()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="8" r="3.5"></circle>
          <path d="M5.5 20c.7-4 3-6 6.5-6s5.8 2 6.5 6"></path>
        </svg>

        <span>Login</span>
      </button>


      <!-- REGISTER -->
      <button
        class="register-btn"
        type="button"
        routerLink="/register"
        (click)="closeMenu()"
      >
        Register Now
        <span>→</span>
      </button>


      <!-- MOBILE MENU -->
      <button
        class="menu-btn"
        type="button"
        aria-label="Toggle menu"
        [attr.aria-expanded]="menuOpen()"
        (click)="toggleMenu()"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

    </div>

  </nav>

</header>
